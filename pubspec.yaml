name: putnik
description: "ПУТНИК - мобильное приложение для организации поездок между городами ЯНАО."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_generator: ^2.3.0

  # API & HTTP
  dio: ^5.3.0
  retrofit: ^4.0.0

  # Serialization
  freezed_annotation: ^2.4.0
  json_serializable: ^6.7.0

  # Navigation
  go_router: ^11.1.0

  # UI
  google_fonts: ^6.1.0
  intl: ^0.19.0

  # Firebase
  firebase_core: ^2.24.0
  firebase_messaging: ^14.6.0

  # Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0

  # Utils
  uuid: ^4.0.0
  connectivity_plus: ^5.0.0
  logger: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  retrofit_generator: ^8.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/videos/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
